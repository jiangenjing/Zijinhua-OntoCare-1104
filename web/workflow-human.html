<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>OntoCare 本地人工审核</title><style>body{max-width:1100px;padding:35px;margin:auto;font:15px/1.8 system-ui;background:#f5f8fc;color:#253c5c}button,input,textarea{padding:12px;margin:8px;border:1px solid #d3dfed;background:white;border-radius:9px}button{cursor:pointer}section,pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px;border-radius:15px;margin:15px 0}textarea{display:block;width:90%}label{display:inline-block}</style>
<a href="/ontology/manager#sop">← 本体工作台</a><h1>本地人工审核工作台</h1><p>本机演示操作员：客服主管。实际保存材料审核、补充信息要求与审核意见；不连接真实退款、换货、物流或外部工单系统。</p><button id="refresh">刷新待办</button><div id="items"></div><section id="review" hidden><h2 id="title"></h2><div id="materials"></div><button id="private">查看本机寄送信息 / SN</button><pre id="private-detail"></pre><label><input type="checkbox" id="ownership">已核实订单归属和寄送信息</label><label><input type="checkbox" id="policy">已核实适用政策和申请条件</label><textarea id="note" placeholder="请填写至少5个字的审核依据；材料核验还需逐项填写理由"></textarea><div id="decisions"></div><p id="status" role="status"></p></section><details><summary>查看申请与审计字段</summary><pre id="detail">选择一条待办。</pre></details>
<script>
const $=id=>document.getElementById(id),make=(tag,text)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x;};let current=null;
async function api(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{}),v=await r.json();if(!r.ok)throw Error(v.error);return v;}
async function load(id){current=id;const d=await api('/api/workflow/tasks/'+id);$('review').hidden=false;$('title').textContent=id+' · '+d.task.status;$('detail').textContent=JSON.stringify(d,null,2);$('private-detail').textContent='';$('materials').replaceChildren();for(const m of d.materials){const row=make('div'),a=make('a','下载 '+m.kind+' · '+m.status);a.href='/api/workflow/material/'+m.id+'/download';row.append(a);for(const [status,label]of [['VERIFIED','核验通过'],['REJECTED','材料不符']]){const b=make('button',label);b.onclick=async()=>{try{await api('/api/workflow/material/'+m.id+'/review',{status,note:$('note').value});await load(id);$('status').textContent='已保存材料人工核验记录。';}catch(e){$('status').textContent=e.message;}};row.append(b);}$('materials').append(row);}}
$('private').onclick=async()=>{try{$('private-detail').textContent=JSON.stringify(await api('/api/workflow/tasks/'+current+'/private'),null,2);}catch(e){$('status').textContent=e.message;}};
for(const [decision,label]of [['NEEDS_INFORMATION','退回补充信息'],['ACCEPT_FOR_LOCAL_PROCESSING','通过本地审核（不执行外部售后）'],['DECLINED','审核不通过']]){const b=make('button',label);b.onclick=async()=>{try{await api('/api/workflow/tasks/'+current+'/decision',{decision,note:$('note').value,ownership_checked:$('ownership').checked,policy_checked:$('policy').checked});await load(current);$('status').textContent='审核结果和审计记录已保存；未执行外部售后。';}catch(e){$('status').textContent=e.message;}};$('decisions').append(b);}
async function refresh(){const d=await api('/api/workflow/tasks');$('items').replaceChildren();for(const t of d.items){const b=make('button',t.id+' · '+t.status+' · '+t.kind);b.onclick=()=>load(t.id).catch(e=>$('status').textContent=e.message);$('items').append(b);}if(!d.items.length)$('items').textContent='当前没有待办。';}$('refresh').onclick=refresh;refresh();
</script></html>
